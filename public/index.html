<!doctype html>
<html lang="es">
<head>

  <meta name="theme-color" content="#111827">
  <title>Omnis: El Último Ciclo</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 20% 15%, #263c70, #111827 52%, #090d17); color: #f8fafc; }
    main { width: min(720px, calc(100% - 40px)); padding: 40px 0; }
    .eyebrow { color: #93c5fd; letter-spacing: .14em; text-transform: uppercase; font-size: .8rem; font-weight: 700; }
    h1 { font-size: clamp(2.3rem, 7vw, 4.8rem); line-height: 1.02; margin: 14px 0; }
    p { color: #cbd5e1; line-height: 1.7; max-width: 58ch; }
    a { display: inline-block; margin-top: 18px; padding: 12px 18px; border-radius: 999px; background: #60a5fa; color: #0b1220; text-decoration: none; font-weight: 700; }
    footer { margin-top: 54px; color: #94a3b8; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Proyecto de videojuego</div>
    <h1>Omnis:<br>El Último Ciclo</h1>
    <p>Portal del proyecto Omnis. Esta página se publica mediante GitLab Pages; el videojuego y sus recursos de desarrollo permanecen en el repositorio del proyecto.</p>
    <a href="https://gitlab.com/omnis-game/omnis-game">Ver repositorio en GitLab</a>
    <footer>Omnis · Sitio estático publicado con GitLab Pages</footer>
  </main>

</html>
