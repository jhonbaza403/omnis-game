name: Omnis Community Governance

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

concurrency:
  group: omnis-community-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  classify-and-welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label contribution and post an idempotent welcome
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const isPullRequest = Boolean(issue.pull_request);
            const labelName = isPullRequest ? "review-needed" : "triage";
            const labelDefinitions = [
              {
                name: "triage",
                color: "1D76DB",
                description: "Issue awaiting maintainer triage"
              },
              {
                name: "review-needed",
                color: "5319E7",
                description: "Pull request awaiting technical review"
              }
            ];

            for (const label of labelDefinitions) {
              try {
                await github.rest.issues.getLabel({
                  ...context.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  ...context.repo,
                  ...label
                });
              }
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: [labelName]
            });

            const marker = "<!-- omnis-community-welcome -->";
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                ...context.repo,
                issue_number: issue.number,
                per_page: 100
              }
            );

            if (comments.some(comment => comment.body?.includes(marker))) {
              core.info("Welcome comment already exists; skipping duplicate.");
              return;
            }

            const message = isPullRequest
              ? `${marker}
            Thank you for contributing to Omnis: El Último Ciclo.

            Your pull request has been received and is awaiting review. No changes are merged automatically.

            Review criteria:
            - Compatibility with the project's declared Unreal Engine version.
            - C++ quality, security, and architectural impact.
            - Relevant tests and reproducible validation evidence.

            Maintainers will review the changes before any integration.`
              : `${marker}
            Thank you for reporting an issue in Omnis: El Último Ciclo.

            The report remains open for maintainer triage. Helpful details include:
            - Steps to reproduce the problem.
            - Expected and actual behavior.
            - Unreal Engine version and platform.
            - Relevant logs with credentials and tokens removed.

            Reports are not closed automatically.`;

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: message
            });
