    - bash Tools/Build/package_platform.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  resource_group: omnis-nintendo-switch
  allow_failure: false
  artifacts:
    when: always
