workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - validate
  - test
  - cloudflare
  - unreal

python_validate:
  stage: validate
  image: python:3.12
  script:
    - bash CI/Validation/validate.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

python_tests:
  stage: test
  image: python:3.12
  script:
    - bash CI/Tests/test.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

cloudflare_validate:
  stage: cloudflare
  image: node:22
  script:
    - npx --yes wrangler@4.148.0 deploy --config wrangler.json --dry-run
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

unreal_build:
  stage: unreal
  tags:
    - unreal56-linux
  needs:
    - python_tests
  script:
    - bash CI/Build/build.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Saved/Logs/omnis_ue56_build.log
