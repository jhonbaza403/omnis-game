    - python_tests
  variables:
    OMNIS_PLATFORM: "XSX"
    OMNIS_CONSOLE_SDK_READY: "true"
  script:
    - bash Tools/Build/package_platform.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  resource_group: omnis-xbox-series
  allow_failure: false
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - Saved/Archived/XSX/

package_nintendo_switch:
  stage: package
