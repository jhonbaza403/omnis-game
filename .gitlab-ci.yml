stages:
  - validate
  - test
  - unreal

python_validate:
  stage: validate
  image: python:3.12
  script:
    - bash CI/Validation/validate.sh

python_tests:
  stage: test
  image: python:3.12
  script:
    - bash CI/Tests/test.sh

unreal_build:
  stage: unreal
  tags:
    - unreal56
  script:
    - bash CI/Build/build.sh
  rules:
    - if: '$UE_ENGINE_ROOT'
      when: manual
    - when: never
  allow_failure: false
