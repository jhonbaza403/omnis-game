# GitLab Pages para el portal estático de Omnis
image: node:22-alpine

stages:
  - deploy

create-pages:
  stage: deploy
  script:
    - test -f public/index.html
    - echo "Validación de GitLab Pages completada."
    - ls -la public
  pages:
    publish: public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
