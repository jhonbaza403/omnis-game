stages:
  - validate
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

variables:
  NODE_ENV: "production"
  UNITY_PROJECT_PATH: "UnityProject"
  UNITY_VERSION: "6000.3.0f1"

create-pages:
  stage: deploy
  image: node:24-alpine
  script:
    - test -f public/index.html
    - echo "GitLab Pages source validated."
    - ls -la public
  pages:
    publish: public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

unity_project_validate:
  stage: validate
  image: alpine:3.22
  script:
    - test -f "$UNITY_PROJECT_PATH/ProjectSettings/ProjectVersion.txt"
    - grep -q m_EditorVersion "$UNITY_PROJECT_PATH/ProjectSettings/ProjectVersion.txt"
    - test -f "$UNITY_PROJECT_PATH/Packages/manifest.json"
    - test -f "$UNITY_PROJECT_PATH/Assets/Omnis/Scripts/OmnisPlayerController.cs"
    - test -f "$UNITY_PROJECT_PATH/Assets/Editor/OmnisSceneBootstrap.cs"
    - echo "Unity migration source structure validated."
  rules:
    - changes:
        - UnityProject/**/*
        - CI/Unity/**/*

unity_build_linux:
  stage: build
  image: "unityci/editor:ubuntu-6000.3.0f1-linux-il2cpp-3"
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - test -n "$UNITY_LICENSE" || (echo "UNITY_LICENSE CI variable is required." >&2; exit 1)
    - mkdir -p "$HOME/.local/share/unity3d/Unity"
    - 'if [ -f "$UNITY_LICENSE" ]; then cp "$UNITY_LICENSE" "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"; else printf "%s" "$UNITY_LICENSE" > "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"; fi'
    - test -s "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"
    - unity-editor -batchmode -nographics -quit -projectPath "$CI_PROJECT_DIR/$UNITY_PROJECT_PATH" -executeMethod Omnis.Editor.OmnisBuild.BuildLinux -logFile -
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - UnityProject/Builds/Linux/
      - UnityProject/Assets/Scenes/OmnisMain.unity
      - UnityProject/Assets/Omnis/Materials/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - UnityProject/**/*
        - CI/Unity/**/*

cloudflare_validate:
  stage: validate
  image: node:24-alpine
  script:
    - npm install --no-audit --no-fund
    - npm run cf:check
  rules:
    - changes:
        - Cloudflare/**/*
        - wrangler.jsonc
        - package.json
        - .gitlab-ci.yml

cloudflare_preview:
  stage: deploy
  image: node:24-alpine
  script:
    - test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID CI variable is required." >&2; exit 1)
    - test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN CI variable is required." >&2; exit 1)
    - npm install --no-audit --no-fund
    - npm run cf:preview
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CLOUDFLARE_API_TOKEN'
      when: manual
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN'
      when: manual

cloudflare_deploy_production:
  stage: deploy
  image: node:24-alpine
  environment:
    name: production
  script:
    - test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID CI variable is required." >&2; exit 1)
    - test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN CI variable is required." >&2; exit 1)
    - npm install --no-audit --no-fund
    - npm run cf:deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN'
      when: manual
