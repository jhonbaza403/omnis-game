stages:
  - validate
  - test
  - cloudflare
  - docker_services
  - unreal_runner
  - unreal_validate
  - unreal
  - package
  - server_smoke
  - container

variables:
  OMNIS_UNREAL_RUNNER_TAG: "unreal56-linux"

python_validate:
  stage: validate
  image: python:3.12
  script:
    - bash CI/Validation/validate.sh
    - python -m py_compile Tools/Editor/GenerateOmnisVerticalSlice.py Tools/Editor/GenerateOmnisWorldContent.py Tools/Editor/MaterializeOmnisPremiumWorld.py CI/Validation/validate_content_sources.py
    - python CI/Validation/validate_content_sources.py

python_tests:
  stage: test
  image: python:3.12
  script:
    - bash CI/Tests/test.sh

docker_services:
  stage: docker_services
  image: docker:27.4.1
  services:
    - name: docker:27.4.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - export OMNIS_SERVICE_TOKEN=ci-test-token
    - docker compose -f infra/docker/compose.yaml config --quiet
    - docker build --pull -f infra/docker/platform.Dockerfile -t "$CI_REGISTRY_IMAGE/platform:$CI_COMMIT_SHA" .
    - docker compose -f infra/docker/compose.yaml up -d --build redis matchmaking session world gateway
    - |
      for i in $(seq 1 30); do
        if docker compose -f infra/docker/compose.yaml exec -T gateway python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)" >/dev/null 2>&1; then
          echo "gateway is healthy"
          break
        fi
        if [ "$i" -eq 30 ]; then
          echo "gateway did not become ready"
          exit 1
        fi
        sleep 2
      done
    - trap 'docker compose -f infra/docker/compose.yaml down -v' EXIT
    - docker compose -f infra/docker/compose.yaml ps
    - docker compose -f infra/docker/compose.yaml exec -T gateway python -c "import urllib.request,json; d=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/world/cycle')); assert d['era']=='Ruinas de Piedra CiÃ©naga'"
    - docker compose -f infra/docker/compose.yaml exec -T gateway python -c "import urllib.request; p=urllib.request.Request('http://127.0.0.1:8080/api/matchmaking/enqueue', data=b'{"playlist":"open-world"}', method='POST', headers={'Content-Type':'application/json','X-Omnis-Player-Id':'ci-player'}); r=urllib.request.urlopen(p); assert r.status == 202"
    - docker compose -f infra/docker/compose.yaml exec -T gateway python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz'); assert r.status == 200"
    - docker compose -f infra/docker/compose.yaml exec -T gateway python -c "import urllib.request; p=urllib.request.Request('http://127.0.0.1:8080/api/sessions', data=b'{"playlist":"open-world","players":["ci-player"]}', method='POST', headers={'Content-Type':'application/json','X-Omnis-Player-Id':'ci-player'}); r=urllib.request.urlopen(p); assert r.status == 201"
    - docker compose -f infra/docker/compose.yaml exec -T gateway python -c "import urllib.request; p=urllib.request.Request('http://127.0.0.1:8080/api/world/events', data=b'{"event_type":"ci_world_probe","player_id":"ci-player","payload":{"source":"gitlab-ci"}}', method='POST', headers={'Content-Type':'application/json','X-Omnis-Player-Id':'ci-player'}); r=urllib.request.urlopen(p); assert r.status == 201"
    - docker compose -f infra/docker/compose.yaml exec -T gateway python -c "import urllib.request; p=urllib.request.Request('http://127.0.0.1:8080/api/world/cycle/advance', data=b'{"reason":"ci_probe"}', method='POST', headers={'Content-Type':'application/json','X-Omnis-Player-Id':'ci-player'}); r=urllib.request.urlopen(p); assert r.status == 200"
    - for service in gateway matchmaking session world; do docker tag "$CI_REGISTRY_IMAGE/platform:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHA"; docker push "$CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHA"; done
  after_script:
    - export OMNIS_SERVICE_TOKEN=ci-test-token
    - docker compose -f infra/docker/compose.yaml ps -a || true
    - docker compose -f infra/docker/compose.yaml logs --no-color || true
    - docker compose -f infra/docker/compose.yaml down -v || true

cloudflare_validate:
  stage: cloudflare
  image: node:22
  script:
    - npx --yes wrangler@4.148.0 deploy --config wrangler.json --dry-run
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

unreal_runner_preflight:
  stage: unreal_runner
  tags:
    - "$OMNIS_UNREAL_RUNNER_TAG"
  script:
    - test -n "$UE_ENGINE_ROOT"
    - test -x "$UE_ENGINE_ROOT/Engine/Build/BatchFiles/RunUBT.sh"
    - test -x "$UE_ENGINE_ROOT/Engine/Build/BatchFiles/RunUAT.sh"
    - test -f "$UE_ENGINE_ROOT/Engine/Build/Build.version"
    - python3 -c 'import json,os; p=json.load(open(os.path.join(os.environ["UE_ENGINE_ROOT"],"Engine/Build/Build.version"))); assert (p["MajorVersion"],p["MinorVersion"])==(5,6), p'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  resource_group: unreal56-linux
  allow_failure: false

unreal_content:
  stage: unreal_validate
  tags:
    - "$OMNIS_UNREAL_RUNNER_TAG"
  needs:
    - python_tests
    - unreal_runner_preflight
  script:
    - bash CI/Build/generate_content.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Content/Omnis/Maps/*.umap
      - Content/Omnis/Art/**/*.uasset
      - Saved/Logs/omnis_content_generation.log

unreal_automation:
  stage: unreal_validate
  tags:
    - "$OMNIS_UNREAL_RUNNER_TAG"
  needs:
    - unreal_content
  script:
    - bash CI/Tests/run_unreal_automation.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Saved/Logs/omnis_unreal_automation.log

unreal_build:
  stage: unreal
  tags:
    - "$OMNIS_UNREAL_RUNNER_TAG"
  needs:
    - unreal_content
  script:
    - bash CI/Build/build.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Saved/Logs/omnis_ue56_build.log

unreal_server_package:
  stage: package
  tags:
    - "$OMNIS_UNREAL_RUNNER_TAG"
  needs:
    - unreal_build
  script:
    - bash CI/Packaging/package.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Build/OmnisServer/
      - Saved/Logs/omnis_ue56_server_package.log

dedicated_server_smoke:
  stage: server_smoke
  tags:
    - "$OMNIS_UNREAL_RUNNER_TAG"
  needs:
    - unreal_server_package
  script:
    - bash CI/Tests/smoke_dedicated_server.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Saved/Logs/omnis_dedicated_server_smoke.log

container_server_image:
  stage: container

  image: docker:27.4.1
  services:
    - name: docker:27.4.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
  needs:
    - job: unreal_server_package
      artifacts: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - test -d Build/OmnisServer
    - test -n "$(find Build/OmnisServer -maxdepth 5 -type f -perm -u+x -iname 'OmnisServer*' -print -quit)"
    - docker build --pull -f infra/docker/unreal-server/Dockerfile -t "$CI_REGISTRY_IMAGE:server-$CI_COMMIT_SHA" .
    - docker image inspect "$CI_REGISTRY_IMAGE:server-$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:server-$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: false
