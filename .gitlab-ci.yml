stages:
  - validate
  - test
  - cloudflare
  - docker_services
  - unreal_validate
  - unreal
  - package
  - container

python_validate:
  stage: validate
  image: python:3.12
  script:
    - bash CI/Validation/validate.sh
    - python -m py_compile Tools/Editor/GenerateOmnisVerticalSlice.py Tools/Editor/GenerateOmnisWorldContent.py CI/Validation/validate_content_sources.py
    - python CI/Validation/validate_content_sources.py

python_tests:
  stage: test
  image: python:3.12
  script:
    - bash CI/Tests/test.sh

docker_services:
  stage: docker_services
  image: docker:27.4.1
  services:
    - name: docker:27.4.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - export OMNIS_SERVICE_TOKEN=ci-test-token
    - docker compose -f infra/docker/compose.yaml config --quiet
    - docker build --pull -f infra/docker/platform.Dockerfile -t "$CI_REGISTRY_IMAGE/platform:$CI_COMMIT_SHA" .
    - docker compose -f infra/docker/compose.yaml up -d --build redis matchmaking session world gateway
    - trap 'docker compose -f infra/docker/compose.yaml down -v' EXIT
    - docker compose -f infra/docker/compose.yaml ps
    - docker compose -f infra/docker/compose.yaml exec -T gateway python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/healthz').status == 200"
    - docker compose -f infra/docker/compose.yaml exec -T gateway python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/api/world/cycle'); assert r.status == 200 and b'Ruinas de Piedra Cienaga' not in r.read()"
    - docker compose -f infra/docker/compose.yaml exec -T gateway python -c "import urllib.request; p=urllib.request.Request('http://127.0.0.1:8080/api/matchmaking/enqueue', data=b'{\"playlist\":\"open-world\"}', method='POST', headers={'Content-Type':'application/json','X-Omnis-Player-Id':'ci-player'}); r=urllib.request.urlopen(p); assert r.status == 202"
    - for service in gateway matchmaking session world; do docker tag "$CI_REGISTRY_IMAGE/platform:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHA"; docker push "$CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHA"; done

cloudflare_validate:
  stage: cloudflare
  image: node:22
  script:
    - npx --yes wrangler@4.148.0 deploy --config wrangler.json --dry-run
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

unreal_content:
  stage: unreal_validate
  tags:
    - unreal56-linux
  needs:
    - python_tests
  script:
    - bash CI/Build/generate_content.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Content/Omnis/Maps/*.umap
      - Content/Omnis/Art/**/*.uasset
      - Saved/Logs/omnis_content_generation.log

unreal_automation:
  stage: unreal_validate
  tags:
    - unreal56-linux
  needs:
    - unreal_content
  script:
    - bash CI/Tests/run_unreal_automation.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Saved/Logs/omnis_unreal_automation.log

unreal_build:
  stage: unreal
  tags:
    - unreal56-linux
  needs:
    - job: unreal_content
      artifacts: true
  script:
    - bash CI/Build/build.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Saved/Logs/omnis_ue56_build.log

unreal_server_package:
  stage: package
  tags:
    - unreal56-linux
  needs:
    - unreal_build
  script:
    - bash CI/Packaging/package.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Build/OmnisServer/
      - Saved/Logs/omnis_ue56_server_package.log

container_server_image:
  stage: container
  image: docker:27.4.1
  services:
    - name: docker:27.4.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
  needs:
    - job: unreal_server_package
      artifacts: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - test -d Build/OmnisServer
    - docker build --pull -f infra/docker/unreal-server/Dockerfile -t "$CI_REGISTRY_IMAGE:server-$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:server-$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: false
