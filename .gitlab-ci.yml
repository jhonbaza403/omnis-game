stages:
  - validate
  - test
  - unreal

python_validate:
  stage: validate
  image: python:3.12
  script:
    - bash CI/Validation/validate.sh

python_tests:
  stage: test
  image: python:3.12
  script:
    - bash CI/Tests/test.sh

unreal_build:
  stage: unreal
  tags:
    - unreal56-linux
  needs:
    - python_tests
  script:
    - bash CI/Build/build.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Saved/Logs/omnis_ue56_build.log
