workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - validate
  - test
  - cloudflare
  - unreal
  - package

release_evidence:
  stage: validate
  image: python:3.12
  when: always
  script:
    - python3 Tools/Release/generate_provenance.py --output Saved/Release/provenance.json
    - python3 Tools/Diagnostics/collect_crash_evidence.py --output Saved/Release/crash-evidence.json
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - Saved/Release/

python_validate:
  stage: validate
  image: python:3.12
  script:
    - bash CI/Validation/validate.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

python_tests:
  stage: test
  image: python:3.12
  script:
    - bash CI/Tests/test.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

cloudflare_validate:
  stage: cloudflare
  image: node:22
  script:
    - npx --yes wrangler@4.148.0 deploy --config wrangler.json --dry-run
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

unreal_build:
  stage: unreal
  tags:
    - unreal56-linux
  needs:
    - python_tests
  script:
    - bash CI/Build/build.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Saved/Logs/omnis_ue56_build.log

package_win64:
  stage: package
  tags:
    - unreal56-win64
  needs:
    - python_tests
  variables:
    OMNIS_PLATFORM: "Win64"
  script:
    - bash Tools/Build/package_platform.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  resource_group: omnis-win64
  allow_failure: false
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - Saved/Archived/Win64/

package_playstation5:
  stage: package
  tags:
    - playstation5-authorized
  needs:
    - python_tests
  variables:
    OMNIS_PLATFORM: "PS5"
    OMNIS_CONSOLE_SDK_READY: "true"
  script:
