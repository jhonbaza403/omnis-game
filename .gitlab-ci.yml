{:content_type=>"text/plain; charset=utf-8", :content=>"stages:\n  - validate\n  - build\n  - deploy\n\n# Linux jobs use the project-owned Docker runner to avoid shared-runner minute quotas.\ndefault:\n  tags:\n    - omnis-linux-docker\n\nworkflow:\n  rules:\n    - if: '$CI_PIPELINE_SOURCE == \"merge_request_event\"'\n    - if: '$CI_COMMIT_BRANCH'\n\nvariables:\n  NODE_ENV: \"production\"\n  UNITY_PROJECT_PATH: \"UnityProject\"\n  UNITY_VERSION: \"6000.3.0f1\"\n\ncreate-pages:\n  stage: deploy\n  image: node:24-alpine\n  script:\n    - test -f public/index.html\n    - echo \"GitLab Pages source validated.\"\n    - ls -la public\n  pages:\n    publish: public\n  artifacts:\n    paths:\n      - public\n  rules:\n    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'\n\nunity_project_validate:\n  stage: validate\n  image: alpine:3.22\n  script:\n    - sh CI/Unity/validate_project.sh\n  rules:\n    - changes:\n        - UnityProject/**/*\n        - CI/Unity/**/*\n        - CI/Runner/**/*\n        - CI/Packaging/**/*\n        - .gitlab-ci.yml\n\nunity_build_linux:\n  stage: build\n  image: \"unityci/editor:ubuntu-6000.3.0f1-linux-il2cpp-3\"\n  variables:\n    GIT_SUBMODULE_STRATEGY: recursive\n  script:\n    - test -n \"$UNITY_LICENSE\" || (echo \"UNITY_LICENSE CI/CD file variable is required.\" >&2; exit 1)\n    - mkdir -p \"$HOME/.local/share/unity3d/Unity\"\n    - 'if [ -f \"$UNITY_LICENSE\" ]; then cp \"$UNITY_LICENSE\" \"$HOME/.local/share/unity3d/Unity/Unity_lic.ulf\"; else printf \"%s\" \"$UNITY_LICENSE\" > \"$HOME/.local/share/unity3d/Unity/Unity_lic.ulf\"; fi'\n    - test -s \"$HOME/.local/share/unity3d/Unity/Unity_lic.ulf\"\n    - unity-editor -batchmode -nographics -quit -projectPath \"$CI_PROJECT_DIR/$UNITY_PROJECT_PATH\" -executeMethod Omnis.Editor.OmnisBuild.BuildLinux -logFile -\n  artifacts:\n    when: always\n    expire_in: 14 days\n    paths:\n      - UnityProject/Builds/Linux/\n      - UnityProject/Assets/Scenes/OmnisMain.unity\n      - UnityProject/Builds/Linux/omnis-release-manifest.json\n  rules:\n    - if: '$CI_PIPELINE_SOURCE == \"merge_request_event\"'\n      changes:\n        - UnityProject/**/*\n        - CI/Unity/**/*\n        - CI/Runner/**/*\n        - CI/Packaging/**/*\n        - .gitlab-ci.yml\n    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'\n      changes:\n        - UnityProject/**/*\n        - CI/Unity/**/*\n        - CI/Runner/**/*\n        - CI/Packaging/**/*\n        - .gitlab-ci.yml\n\n# Manual Windows release: requires a separate registered Windows shell runner.\nunity_build_windows:\n  stage: build\n  tags:\n    - omnis-windows\n  script:\n    - |\n      $ErrorActionPreference = \"Stop\"\n      $editor = $env:UNITY_EDITOR_PATH\n      if ([string]::IsNullOrWhiteSpace($editor)) {\n        $editor = \"C:\\Program Files\\Unity\\Hub\\Editor\\6000.3.0f1\\Editor\\Unity.exe\"\n      }\n      if (!(Test-Path -LiteralPath $editor)) {\n        throw \"Unity Editor not found. Install Unity 6000.3.0f1 with Windows Build Support or set UNITY_EDITOR_PATH.\"\n      }\n      if ([string]::IsNullOrWhiteSpace($env:UNITY_LICENSE)) {\n        throw \"UNITY_LICENSE must be configured as a protected File CI/CD variable.\"\n      }\n      $licenseDirectory = Join-Path $env:LOCALAPPDATA \"Unity\"\n      New-Item -ItemType Directory -Force -Path $licenseDirectory | Out-Null\n      if (!(Test-Path -LiteralPath $env:UNITY_LICENSE -PathType Leaf)) {\n        throw \"UNITY_LICENSE must be a File CI/CD variable pointing to a valid .ulf file.\"\n      }\n      Copy-Item -LiteralPath $env:UNITY_LICENSE -Destination (Join-Path $licenseDirectory \"Unity_lic.ulf\") -Force\n      $logPath = Join-Path $env:CI_PROJECT_DIR \"unity-windows-build.log\"\n      & $editor -batchmode -nographics -quit -projectPath (Join-Path $env:CI_PROJECT_DIR $env:UNITY_PROJECT_PATH) -executeMethod Omnis.Editor.OmnisBuild.BuildWindows -logFile $logPath\n      if ($LASTEXITCODE -ne 0) { throw \"Unity Windows build failed with exit code $LASTEXITCODE. See unity-windows-build.log.\" }\n  artifacts:\n    when: always\n    expire_in: 14 days\n    paths:\n      - UnityProject/Builds/Windows/\n      - unity-windows-build.log\n  rules:\n    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'\n      changes:\n        - UnityProject/**/*\n        - CI/Unity/**/*\n        - CI/Runner/**/*\n        - CI/Packaging/**/*\n        - .gitlab-ci.yml\n      when: manual\n      allow_failure: true\n\ncloudflare_validate:\n  stage: validate\n  image: node:24-alpine\n  script:\n    - npm install --no-audit --no-fund\n    - npm run cf:check\n  rules:\n    - changes:\n        - Cloudflare/**/*\n        - wrangler.jsonc\n        - package.json\n        - .gitlab-ci.yml\n\ncloudflare_preview:\n  stage: deploy\n  image: node:24-alpine\n  script:\n    - test -n \"$CLOUDFLARE_ACCOUNT_ID\" || (echo \"CLOUDFLARE_ACCOUNT_ID CI/CD variable is required.\" >&2; exit 1)\n    - test -n \"$CLOUDFLARE_API_TOKEN\" || (echo \"CLOUDFLARE_API_TOKEN CI/CD variable is required.\" >&2; exit 1)\n    - npm install --no-audit --no-fund\n    - npm run cf:preview\n  rules:\n    - if: '$CI_PIPELINE_SOURCE == \"merge_request_event\" && $CLOUDFLARE_API_TOKEN'\n      when: manual\n    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN'\n      when: manual\n\ncloudflare_deploy_production:\n  stage: deploy\n  image: node:24-alpine\n  environment:\n    name: production\n  script:\n    - test -n \"$CLOUDFLARE_ACCOUNT_ID\" || (echo \"CLOUDFLARE_ACCOUNT_ID CI/CD variable is required.\" >&2; exit 1)\n    - test -n \"$CLOUDFLARE_API_TOKEN\" || (echo \"CLOUDFLARE_API_TOKEN CI/CD variable is required.\" >&2; exit 1)\n    - npm install --no-audit --no-fund\n    - npm run cf:deploy\n  rules:\n    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN'\n      when: manual\n"}