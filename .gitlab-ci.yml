stages:
  - validate
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

variables:
  NODE_ENV: "production"
  UNITY_PROJECT_PATH: "UnityProject"
  UNITY_VERSION: "6000.3.0f1"

# Preserve GitLab Pages for the existing static portal.
create-pages:
  stage: deploy
  image: node:24-alpine
  script:
    - test -f public/index.html
    - echo "GitLab Pages source validated."
    - ls -la public
  pages:
    publish: public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Validate that the Unity project shell is real. This does not claim that
# Unreal gameplay, UAssets, UMaps, or C++ systems have been ported.
unity_project_validate:
  stage: validate
  image: alpine:3.22
  script:
    - test -f "$UNITY_PROJECT_PATH/ProjectSettings/ProjectVersion.txt"
    - grep -q '^m_EditorVersion: ' "$UNITY_PROJECT_PATH/ProjectSettings/ProjectVersion.txt"
    - test -f "$UNITY_PROJECT_PATH/Packages/manifest.json"
    - test -d "$UNITY_PROJECT_PATH/Assets"
    - echo "Unity project structure validated; gameplay migration is tracked separately."
  rules:
    - changes:
        - UnityProject/**/*
        - CI/Unity/**/*

# This job only appears when a real main scene has been ported and committed.
# It requires a Unity license stored as a protected/masked CI variable.
unity_build_linux:
  stage: build
  image: "unityci/editor:6000.3.0f1-base-3"
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - test -n "$UNITY_LICENSE" || (echo "UNITY_LICENSE CI variable is required." >&2; exit 1)
    - test -f "$UNITY_PROJECT_PATH/Assets/Scenes/OmnisMain.unity" || (echo "Gameplay migration incomplete: OmnisMain.unity is not present." >&2; exit 1)
    - mkdir -p "$HOME/.local/share/unity3d/Unity" build
    - printf '%s' "$UNITY_LICENSE" > "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"
    - unity-editor -batchmode -nographics -quit -projectPath "$CI_PROJECT_DIR/$UNITY_PROJECT_PATH" -buildLinux64Player "$CI_PROJECT_DIR/build/Omnis.x86_64" -logFile -
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      exists:
        - UnityProject/Assets/Scenes/OmnisMain.unity
      changes:
        - UnityProject/**/*
        - CI/Unity/**/*

# Cloudflare Worker validation uses the exact Wrangler version pinned in package.json.
cloudflare_validate:
  stage: validate
  image: node:24-alpine
  script:
    - npm install --no-audit --no-fund
    - npm run cf:check
  rules:
    - changes:
        - Cloudflare/**/*
        - wrangler.jsonc
        - package.json
        - .gitlab-ci.yml

# Preview deployment is intentionally manual and requires protected CI variables.
cloudflare_preview:
  stage: deploy
  image: node:24-alpine
  script:
    - test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID CI variable is required." >&2; exit 1)
    - test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN CI variable is required." >&2; exit 1)
    - npm install --no-audit --no-fund
    - npm run cf:preview
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CLOUDFLARE_API_TOKEN'
      when: manual
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN'
      when: manual

# Production deployment can only be triggered manually from the default branch.
cloudflare_deploy_production:
  stage: deploy
  image: node:24-alpine
  environment:
    name: production
  script:
    - test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID CI variable is required." >&2; exit 1)
    - test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN CI variable is required." >&2; exit 1)
    - npm install --no-audit --no-fund
    - npm run cf:deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN'
      when: manual
