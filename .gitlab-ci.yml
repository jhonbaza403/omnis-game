stages:
  - validate
  - test
  - cloudflare
  - unreal_validate
  - unreal
  - package

python_validate:
  stage: validate
  image: python:3.12
  script:
    - bash CI/Validation/validate.sh
    - python -m py_compile Tools/Editor/GenerateOmnisVerticalSlice.py Tools/Editor/GenerateOmnisWorldContent.py CI/Validation/validate_content_sources.py
    - python CI/Validation/validate_content_sources.py

python_tests:
  stage: test
  image: python:3.12
  script:
    - bash CI/Tests/test.sh

cloudflare_validate:
  stage: cloudflare
  image: node:22
  script:
    - npx --yes wrangler@4.148.0 deploy --config wrangler.json --dry-run
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

unreal_content:
  stage: unreal_validate
  tags:
    - unreal56-linux
  needs:
    - python_tests
  script:
    - bash CI/Build/generate_content.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Content/Omnis/Maps/*.umap
      - Content/Omnis/Art/**/*.uasset
      - Saved/Logs/omnis_content_generation.log

unreal_automation:
  stage: unreal_validate
  tags:
    - unreal56-linux
  needs:
    - unreal_content
  script:
    - bash CI/Tests/run_unreal_automation.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Saved/Logs/omnis_unreal_automation.log

unreal_build:
  stage: unreal
  tags:
    - unreal56-linux
  needs:
    - job: unreal_content
      artifacts: true
  script:
    - bash CI/Build/build.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Saved/Logs/omnis_ue56_build.log

package_game:
  stage: package
  tags:
    - unreal56-linux
  needs:
    - unreal_build
  script:
    - bash CI/Packaging/package.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never
  resource_group: unreal56-linux
  allow_failure: false
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - Build/Omnis/
