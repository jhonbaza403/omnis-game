stages:
  - validate
  - build
  - deploy

# Lightweight Node/Alpine jobs use eligible shared runners.
# Only Unity Editor jobs require the dedicated Unity 7 runner.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

variables:
  NODE_ENV: "production"
  UNITY_PROJECT_PATH: "UnityProject"
  UNITY_VERSION: "7000.0.0a7"

create-pages:
  stage: deploy
  tags:
    - omnis-linux-docker
  image: node:24-alpine
  script:
    - test -f public/index.html
    - echo "GitLab Pages source validated."
    - ls -la public
  pages:
    publish: public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

unity_project_validate:
  stage: validate
  tags:
    - omnis-linux-docker
  image: alpine:3.22
  script:
    - sh CI/Unity/validate_project.sh
  rules:
    - changes:
        - UnityProject/**/*
        - CI/Unity/**/*
        - CI/Runner/**/*
        - CI/Packaging/**/*
        - .gitlab-ci.yml

unity_editor_validate:
  stage: validate
  tags:
    - omnis-unity7
  script:
    - |
      set -eu
      EDITOR="${UNITY_EDITOR_PATH:-unity-editor}"
      if [ -x "$EDITOR" ]; then
        :
      elif command -v "$EDITOR" >/dev/null 2>&1; then
        EDITOR="$(command -v "$EDITOR")"
      else
        echo "Unity Editor not found. Install Unity ${UNITY_VERSION} and set UNITY_EDITOR_PATH." >&2
        exit 1
      fi
      test -n "$UNITY_LICENSE" || (echo "UNITY_LICENSE CI/CD variable is required." >&2; exit 1)
      mkdir -p "$HOME/.local/share/unity3d/Unity"
      if [ -f "$UNITY_LICENSE" ]; then
        cp "$UNITY_LICENSE" "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"
      else
        printf "%s" "$UNITY_LICENSE" > "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"
      fi
      "$EDITOR" -batchmode -nographics -quit -projectPath "$CI_PROJECT_DIR/$UNITY_PROJECT_PATH" -executeMethod Omnis.Editor.OmnisBuild.ValidateProject -logFile -
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - UnityProject/**/*
        - CI/Unity/**/*
        - .gitlab-ci.yml


unity_playmode_tests:
  stage: validate
  tags:
    - omnis-unity7
  script:
    - |
      set -eu
      EDITOR="${UNITY_EDITOR_PATH:-unity-editor}"
      if [ -x "$EDITOR" ]; then
        :
      elif command -v "$EDITOR" >/dev/null 2>&1; then
        EDITOR="$(command -v "$EDITOR")"
      else
        echo "Unity Editor not found. Install Unity ${UNITY_VERSION} and set UNITY_EDITOR_PATH." >&2
        exit 1
      fi
      test -n "$UNITY_LICENSE" || (echo "UNITY_LICENSE CI/CD variable is required." >&2; exit 1)
      mkdir -p "$HOME/.local/share/unity3d/Unity" "$CI_PROJECT_DIR/UnityProject/TestResults"
      if [ -f "$UNITY_LICENSE" ]; then
        cp "$UNITY_LICENSE" "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"
      else
        printf "%s" "$UNITY_LICENSE" > "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"
      fi
      "$EDITOR" -batchmode -nographics -projectPath "$CI_PROJECT_DIR/$UNITY_PROJECT_PATH" -runTests -testPlatform PlayMode -testResults "$CI_PROJECT_DIR/UnityProject/TestResults/playmode-results.xml" -logFile -
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: UnityProject/TestResults/playmode-results.xml
    paths:
      - UnityProject/TestResults/playmode-results.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - UnityProject/**/*
        - CI/Unity/**/*
        - .gitlab-ci.yml

unity_build_linux:
  stage: build
  tags:
    - omnis-unity7
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - |
      set -eu
      EDITOR="${UNITY_EDITOR_PATH:-unity-editor}"
      if [ -x "$EDITOR" ]; then
        :
      elif command -v "$EDITOR" >/dev/null 2>&1; then
        EDITOR="$(command -v "$EDITOR")"
      else
        echo "Unity Editor not found. Install Unity ${UNITY_VERSION} and set UNITY_EDITOR_PATH." >&2
        exit 1
      fi
      test -n "$UNITY_LICENSE" || (echo "UNITY_LICENSE CI/CD variable is required." >&2; exit 1)
      mkdir -p "$HOME/.local/share/unity3d/Unity"
      if [ -f "$UNITY_LICENSE" ]; then
        cp "$UNITY_LICENSE" "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"
      else
        printf "%s" "$UNITY_LICENSE" > "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"
      fi
      "$EDITOR" -batchmode -nographics -quit -projectPath "$CI_PROJECT_DIR/$UNITY_PROJECT_PATH" -executeMethod Omnis.Editor.OmnisBuild.BuildLinux -logFile -
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - UnityProject/Builds/Linux/
      - UnityProject/Assets/Scenes/OmnisMain.unity
      - UnityProject/Builds/Linux/omnis-release-manifest.json
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - UnityProject/**/*
        - CI/Unity/**/*
        - CI/Runner/**/*
        - CI/Packaging/**/*
        - .gitlab-ci.yml

unity_build_windows:
  stage: build
  tags:
    - omnis-windows
  script:
    - |
      $ErrorActionPreference = "Stop"
      $editor = $env:UNITY_EDITOR_PATH
      if ([string]::IsNullOrWhiteSpace($editor)) {
        $editor = "C:\Program Files\Unity\Hub\Editor\7000.0.0a7\Editor\Unity.exe"
      }
      if (!(Test-Path -LiteralPath $editor)) {
        throw "Unity Editor 7000.0.0a7 not found. Install Unity with Windows Build Support or set UNITY_EDITOR_PATH."
      }
      if ([string]::IsNullOrWhiteSpace($env:UNITY_LICENSE)) {
        throw "UNITY_LICENSE must be configured as a protected File CI/CD variable."
      }
      $licenseDirectory = Join-Path $env:LOCALAPPDATA "Unity"
      New-Item -ItemType Directory -Force -Path $licenseDirectory | Out-Null
      if (!(Test-Path -LiteralPath $env:UNITY_LICENSE -PathType Leaf)) {
        throw "UNITY_LICENSE must be a File CI/CD variable pointing to a valid .ulf file."
      }
      Copy-Item -LiteralPath $env:UNITY_LICENSE -Destination (Join-Path $licenseDirectory "Unity_lic.ulf") -Force
      $logPath = Join-Path $env:CI_PROJECT_DIR "unity-windows-build.log"
      & $editor -batchmode -nographics -quit -projectPath (Join-Path $env:CI_PROJECT_DIR $env:UNITY_PROJECT_PATH) -executeMethod Omnis.Editor.OmnisBuild.BuildWindows -logFile $logPath
      if ($LASTEXITCODE -ne 0) { throw "Unity Windows build failed with exit code $LASTEXITCODE. See unity-windows-build.log." }
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - UnityProject/Builds/Windows/
      - unity-windows-build.log
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - UnityProject/**/*
        - CI/Unity/**/*
        - CI/Runner/**/*
        - CI/Packaging/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true

cloudflare_validate:
  stage: validate
  tags:
    - omnis-linux-docker
  image: node:24-alpine
  script:
    - npm install --no-audit --no-fund
    - npm run cf:check
  rules:
    - changes:
        - Cloudflare/**/*
        - wrangler.jsonc
        - package.json
        - .gitlab-ci.yml

cloudflare_preview:
  stage: deploy
  tags:
    - omnis-linux-docker
  image: node:24-alpine
  script:
    - test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID CI/CD variable is required." >&2; exit 1)
    - test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN CI/CD variable is required." >&2; exit 1)
    - npm install --no-audit --no-fund
    - npm run cf:preview
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CLOUDFLARE_API_TOKEN'
      when: manual
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN'
      when: manual

cloudflare_deploy_production:
  stage: deploy
  tags:
    - omnis-linux-docker
  image: node:24-alpine
  environment:
    name: production
  script:
    - test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID CI/CD variable is required." >&2; exit 1)
    - test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN CI/CD variable is required." >&2; exit 1)
    - npm install --no-audit --no-fund
    - npm run cf:deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN'
      when: manual
