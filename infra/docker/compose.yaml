name: omnis

x-platform: &platform
  build:
    context: ../..
    dockerfile: infra/docker/platform.Dockerfile
  environment:
    REDIS_ADDR: redis:6379
    OMNIS_SERVICE_TOKEN: ${OMNIS_SERVICE_TOKEN:?set OMNIS_SERVICE_TOKEN in .env}
  networks: [omnis-backend]
  restart: unless-stopped

services:
  gateway:
    <<: *platform
    environment:
      REDIS_ADDR: redis:6379
      OMNIS_SERVICE_TOKEN: ${OMNIS_SERVICE_TOKEN:?set OMNIS_SERVICE_TOKEN in .env}
      SERVICE_ROLE: gateway
      LISTEN_PORT: "8080"
      MATCHMAKING_URL: http://matchmaking:8080
      SESSION_URL: http://session:8080
      WORLD_URL: http://world:8080
    ports:
      - "8080:8080"
    depends_on:
      matchmaking: { condition: service_healthy }
      session: { condition: service_healthy }
      world: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  matchmaking:
    <<: *platform
    environment:
      REDIS_ADDR: redis:6379
      OMNIS_SERVICE_TOKEN: ${OMNIS_SERVICE_TOKEN:?set OMNIS_SERVICE_TOKEN in .env}
      SERVICE_ROLE: matchmaking
      LISTEN_PORT: "8080"
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  session:
    <<: *platform
    environment:
      REDIS_ADDR: redis:6379
      OMNIS_SERVICE_TOKEN: ${OMNIS_SERVICE_TOKEN:?set OMNIS_SERVICE_TOKEN in .env}
      SERVICE_ROLE: session
      LISTEN_PORT: "8080"
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  world:
    <<: *platform
    environment:
      REDIS_ADDR: redis:6379
      OMNIS_SERVICE_TOKEN: ${OMNIS_SERVICE_TOKEN:?set OMNIS_SERVICE_TOKEN in .env}
      SERVICE_ROLE: world
      LISTEN_PORT: "8080"
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [omnis-backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  omnis-dedicated-server:
    image: ${OMNIS_GAME_SERVER_IMAGE:-registry.gitlab.com/omnis-game/omnis-game:server-dev}
    environment:
      OMNIS_BACKEND_URL: http://gateway:8080
      OMNIS_SERVICE_TOKEN: ${OMNIS_SERVICE_TOKEN:?set OMNIS_SERVICE_TOKEN in .env}
      OMNIS_SERVER_MAP: ${OMNIS_SERVER_MAP:-/Game/Omnis/Maps/Omnis_OpenWorld}
      OMNIS_SERVER_PORT: ${OMNIS_SERVER_PORT:-7777}
    ports:
      - "${OMNIS_SERVER_PORT:-7777}:${OMNIS_SERVER_PORT:-7777}/udp"
    depends_on:
      gateway: { condition: service_healthy }
    networks: [omnis-backend]
    restart: unless-stopped
    profiles: [game]

networks:
  omnis-backend:
    driver: bridge
    internal: true

volumes:
  redis-data:
